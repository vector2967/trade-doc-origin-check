    <script>
      // ThemeToggle 이 저장한 선택(없으면 라이트)을 그리기 전에 적용해 깜빡임을 막는다
      var t = 'light'
      try {
        var saved = localStorage.getItem('origin-check.theme')
        if (saved === 'light' || saved === 'dark') t = saved
      } catch (e) {}
      document.documentElement.dataset.theme = t
    </script>
